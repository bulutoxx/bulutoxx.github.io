name: OXXai at yarisi canli (gun ici)
# Yarış saatleri (TSİ 11:00–00:59 = UTC 08–21): her iş ~28 dk boyunca 5 dk arayla döner (tahmin tazeleme + sonuç yoklama);
# zamanlayıcı 15 dk'da bir tetikler, concurrency kuyruğu (en çok 1 bekleyen) işleri arka arkaya dizer → zamanlayıcı
# gecikse de yarış saatlerinde kesintisiz ~5 dk aralık. Yeni koşu sonucu gelince o tur HEMEN kaydedilir (en az 5 dk arayla);
# sonuç yoksa en çok 15 dk'da bir kayıt (Pages derleme sınırı: saatte ~10 derleme).
# Gece/sabah (TSİ 00:07–02:37 ve 07:07–10:37): 30 dk'da bir tek tur — geç yayınlanan sonuçlar ve sabah programı.
# Her çalışma son 3 günün sonucu eksik koşularını da yeniden dener (canli.py GERI_GUN; tahminler korunur, sonuç eklenir).
# Yalnız data/at/canli/, data/at/oran_izi/, data/at/karne.json, 6'lı (data/at/altili/, altili_karne.json), KUPO at
# (data/oxx_kupon/at/) ve türetilmiş ek kaynak özetlerini yazar; futbol sistemine, index.html'e dokunmaz.
# Veri: github.com/cenkozgur/tjk-data aynası (sığ klon, _tjk-data, gitignore'da) + Ek kaynak A (yalnız secret; sonuç yedeği,
# adres hiçbir yere yazılmaz, _ek_sonuc/ gitignore'da). Resmî yarış sitelerine istek YOK.
# Yeniden eğitim yok: gece akışının (at-lab.yml) kaydettiği yayın modeli kullanılır (her turda uzak daldan tazelenir).
# Dakika: depo herkese açık → GitHub Actions dakikası sınırsız (özel depoda ≈ 26 bin dk/ay olurdu; ücretsiz kota 2 bin).
on:
  schedule:
    - cron: "*/15 8-21 * * *"
    - cron: "7,37 4-7,22-23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: at-canli   # ayrı grup: at-lab (05:23 / 12:23) iptal edilmesin; aynı dosyalar lab/gonder.py ile anahtar düzeyinde birleşir
  cancel-in-progress: false
jobs:
  canli:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # kurtarıcının "45 dk kuyrukta bekleyen" kuralının altında kalsın
    env:
      SURE_SN: "1680"      # yarış saatlerinde döngü süresi (28 dk)
      ARALIK_SN: "300"     # tur aralığı (5 dk)
      KAYIT_SN: "900"      # sonuç yokken en sık kayıt aralığı (15 dk)
      AT_KAYNAK: ./_tjk-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy lightgbm || pip install -q numpy
      - name: 🗃️ Ham veri önbelleği (replay_kosular — koşu sonuçları; herkese açık release'e girmez, yalnız actions/cache)
        uses: actions/cache/restore@v4
        with:
          path: data/at/replay_kosular.json
          key: arsiv-replay-kosular-${{ github.run_id }}
          restore-keys: arsiv-replay-kosular-
      - name: 🗃️ Yayın modelinin ağaçları ve yeniden oynatma arşivden (sürüm uyuşmazsa model doğrusal yedeğe düşer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-indir --onem bilgi -- python3 lab/arsiv.py indir data/at/gbm_uretim.txt data/at/replay_kosular.json
      - name: Aynayı sığ klonla (yalnız okunur, depoya yazılmaz)
        run: python3 lab/adim.py ayna -- git clone -q --depth 1 https://github.com/cenkozgur/tjk-data _tjk-data
      - name: Ek kaynak A (yalnız türetilmiş özellikler; 6 saatte bir; adres secret'ta, yoksa atlanır)
        env:
          AT_EK_KAYNAK: ${{ secrets.AT_EK_KAYNAK }}
        run: python3 lab/adim.py ek-kaynak --onem bilgi -- python3 lab/at/ek_kaynak.py --gerekirse 6
      - name: 🐎 Gün içi döngü (5 dk arayla tahmin + sonuç yoklama; yeni sonuç gelince hemen kayıt + 🎟️ KUPO puanlama)
        env:
          GH_TOKEN: ${{ github.token }}
          AT_EK_KAYNAK: ${{ secrets.AT_EK_KAYNAK }}
        run: |
          SAAT=$(date -u +%-H)
          if [ "$SAAT" -ge 8 ] && [ "$SAAT" -le 21 ] && [ "${{ github.event_name }}" = "schedule" ]; then SURE=$SURE_SN; else SURE=0; fi
          BAS=$(date +%s); SON_KAYIT=$BAS; ONCEKI=-1; i=0
          export AT_BITTI_SAYAC="$RUNNER_TEMP/at_bitti"
          YOLLAR="data/at/canli data/at/ek_ozellik data/at/karne.json data/at/altili data/at/altili_karne.json data/oxx_kupon/at data/at/oran_izi data/saglik"
          while :; do
            i=$((i+1)); t0=$(date +%s)
            GUNC="--guncelleme-yok"
            if [ "$i" -gt 1 ]; then
              GUNC=""   # canli.py aynayı kendisi günceller (yalnız github.com/cenkozgur/tjk-data)
              python3 lab/gonder.py --tazele data/at/model.json data/at/tahmin data/at/jokeyler.json data/at/kariyer.json
              python3 lab/arsiv.py indir data/at/gbm_uretim.txt   # model.json ile aynı sürüm değilse yazılmaz
            fi
            python3 lab/adim.py at-canli -- timeout 420 python lab/at/canli.py $GUNC
            python3 lab/adim.py at-kupon -- timeout 60 python scripts/oxx_kupon.py --at
            SIMDI=$(cat "$AT_BITTI_SAYAC" 2>/dev/null || echo 0)
            YENI=0; if [ "$ONCEKI" -ge 0 ] && [ "$SIMDI" -gt "$ONCEKI" ]; then YENI=1; fi
            if [ "$i" -eq 1 ] && [ "$SIMDI" -gt 0 ]; then YENI=1; fi   # ilk tur: önceki işten bu yana gelen sonuçlar
            ONCEKI=$SIMDI
            KALAN=$(( BAS + SURE - $(date +%s) ))
            if [ "$KALAN" -le "$ARALIK_SN" ]; then break; fi   # son tur: aşağıdaki kayıt adımı yazar
            if [ "$YENI" = 1 ] || [ $(( $(date +%s) - SON_KAYIT )) -ge "$KAYIT_SN" ]; then
              echo "tur $i: kayıt (yeni sonuç=$YENI, toplam sonuçlu koşu=$SIMDI)"
              python3 lab/gonder.py -m "At canlı: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M') [skip ci]" $YOLLAR || true
              SON_KAYIT=$(date +%s)
            fi
            s=$(( t0 + ARALIK_SN - $(date +%s) ))
            if [ "$s" -gt 0 ]; then sleep "$s"; fi
          done
      - name: Son turun türetilmiş çıktılarını kaydet
        run: |
          python3 lab/gonder.py -m "At canlı: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M') [skip ci]" \
            data/at/canli data/at/ek_ozellik data/at/karne.json data/at/altili data/at/altili_karne.json data/oxx_kupon/at data/at/oran_izi data/saglik
