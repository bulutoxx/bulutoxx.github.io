name: BULUTOXX at yarisi kesif (hazirlik)
# Yalnız at-hazirlik dalında çalışır; ana uygulamaya ve futbol robotlarına dokunmaz. Yalnız yapı özetini
# (tablo başlıkları, bağlantılar) bu dala yazar; ham sayfa yayınlamaz.
# DEVRE DIŞI (GOREV.md kırmızı çizgi 1): tjk.org robots.txt tüm botları yasaklıyor; bu keşif robotu artık
# otomatik çalışmaz. Veri yalnız github.com/cenkozgur/tjk-data aynasından gelir (bkz. at-lab.yml).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python lab/at/kesif.py "25/10/2026" || true
      - name: Raporu yalnız at-hazirlik dalına yaz (ham sayfa yok, yalnız yapı özeti)
        run: |
          git config user.name "bulutoxx-bot"; git config user.email "bulutoxx-bot@users.noreply.github.com"
          git add lab/at/rapor/kesif.json && git commit -qm "Keşif raporu [skip ci]" && git push -q origin HEAD:at-hazirlik || true
