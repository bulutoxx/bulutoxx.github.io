name: BULUTOXX at yarisi kesif (hazirlik)
# Yalnız at-hazirlik dalında çalışır; ana uygulamaya ve futbol robotlarına dokunmaz. Hiçbir şey commit etmez,
# bulguları 7 günlük iş akışı eki olarak bırakır.
on:
  push:
    branches: [at-hazirlik]
    paths: ["lab/at/**", ".github/workflows/at-kesif.yml"]
permissions:
  contents: read
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python lab/at/kesif.py "25/10/2026" || true
      - uses: actions/upload-artifact@v4
        with: { name: at-kesif, path: kesif_out, retention-days: 7 }
