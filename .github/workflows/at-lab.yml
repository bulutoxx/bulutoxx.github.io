name: BULUTOXX at yarisi laboratuvari (gece)
# Yalnız at-hazirlik dalına yazar; futbol sistemine, index.html'e ve data/*.json'a dokunmaz.
# Veri: github.com/cenkozgur/tjk-data aynası çalışma anında sığ klonlanır (_tjk-data, gitignore'da); tjk.org'a istek YOK.
# Not: GitHub zamanlanmış (schedule) iş akışlarını yalnız varsayılan daldan (main) çalıştırır. Bu dosya main'e
# birleştirilene kadar iş akışı yalnız at-hazirlik dalına lab/at/** itildiğinde veya elle çalışır.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [at-hazirlik]
    paths: ["lab/at/**", "!lab/at/RAPOR.md", ".github/workflows/at-lab.yml"]
permissions:
  contents: write
concurrency:
  group: at-lab
  cancel-in-progress: false
jobs:
  gece:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: at-hazirlik
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - name: Aynayı sığ klonla (yalnız okunur, depoya yazılmaz)
        run: git clone -q --depth 1 https://github.com/cenkozgur/tjk-data _tjk-data || echo "ayna klonlanamadı"
      - name: Gece boru hattı (eğitim, kapı, kilit, karne, rapor)
        env:
          AT_KAYNAK: ./_tjk-data
        run: python lab/at/gece.py || echo "gece.py başarısız; önceki çıktılar korunuyor"
      - name: Araştırmacı (yalnız GitHub arama API'si)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python lab/at/arastirma.py || echo "arastirma.py başarısız"
      - name: Yalnız türetilmiş çıktıları at-hazirlik dalına yaz
        run: |
          git config user.name "bulutoxx-bot"; git config user.email "bulutoxx-bot@users.noreply.github.com"
          git add data/at lab/at/RAPOR.md
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -qm "At lab: gece eğitimi, kilit ve karne [skip ci]"
          for i in 1 2 3; do git pull -q --no-rebase origin at-hazirlik && git push -q origin HEAD:at-hazirlik && break; sleep 5; done
