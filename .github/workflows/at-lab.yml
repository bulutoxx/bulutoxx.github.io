name: OXXai at yarisi laboratuvari (gece)
# Yalnız data/at ve lab/at/RAPOR.md yazar; futbol sistemine, index.html'e ve data/*.json'a dokunmaz.
# Veri: github.com/cenkozgur/tjk-data aynası çalışma anında sığ klonlanır (_tjk-data, gitignore'da); tjk.org'a istek YOK.
# Her gün 05:23 ve 12:23 (TSİ): ayna gece 04:30 civarı güncellenir; öğlen çalışması geç gelen programı da kilitler.
# Adım çıkış kodları data/saglik/at-lab.json'a yazılır (lab/adim.py); kaydetme lab/gonder.py (veri kaybetmeyen birleştirme).
on:
  schedule:
    - cron: "23 2,9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/at/**", "!lab/at/RAPOR.md", ".github/workflows/at-lab.yml"]
permissions:
  contents: write
concurrency:
  group: at-lab
  cancel-in-progress: false
jobs:
  gece:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AT_KAYNAK: ./_tjk-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # lightgbm: modelin ağaç katmanı (kurulamazsa model doğrusal yedeğe düşer)
      - run: pip install -q numpy lightgbm || pip install -q numpy
      - name: 🗃️ Model ağaçları, sınama izi, yeniden oynatma arşivden (yoksa gece.py yeniden üretir / doğrusal yedek)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-indir --onem bilgi -- python3 lab/arsiv.py indir data/at/gbm_uretim.txt data/at/sinama_izi.json data/at/replay_kosular.json
      - name: Aynayı sığ klonla (yalnız okunur, depoya yazılmaz)
        run: python3 lab/adim.py ayna -- git clone -q --depth 1 https://github.com/cenkozgur/tjk-data _tjk-data
      - name: Gece boru hattı (eğitim, kapı, kilit, karne, rapor)
        run: python3 lab/adim.py gece -- python lab/at/gece.py
      - name: Sızıntı testi (kapalı-sol pencere, gün içi sıra; bilgi amaçlı)
        run: python3 lab/adim.py sizinti-testi --onem bilgi -- timeout 300 python lab/at/test_sizinti.py
      - name: Araştırmacı (yalnız GitHub arama API'si)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 lab/adim.py arastirmaci --onem bilgi -- python lab/at/arastirma.py
      - name: 🗃️ Arşive yükle (yalnız değiştiyse; model.json ile aynı çalışmada, commit'ten önce)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-yukle -- python3 lab/arsiv.py yukle --en-az-saat 0 data/at/gbm_uretim.txt data/at/sinama_izi.json data/at/replay_kosular.json
      - name: Yalnız türetilmiş çıktıları kaydet
        run: |
          python3 lab/gonder.py -m "At lab: gece eğitimi, kilit ve karne [skip ci]" data/at lab/at/RAPOR.md data/saglik
