name: OXXai otomatik laboratuvar
# Her gece (ve elle) açık kaynak modelleri bizim motorla aynı veride yarıştırır; iki sezonda kanıtlanan karışım motor tarafından otomatik uygulanır.
# Adım çıkış kodları data/saglik/auto-lab.json'a (lab/adim.py); sürekli ölçüm ayrıca surekli-deney.yml'de (dönen lig alt kümesi, yalnız ölçüm).
on:
  schedule:
    - cron: "41 2 * * *"    # her gece (önce haftada bir)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/auto_lab.py", ".github/workflows/auto-lab.yml"]
permissions:
  contents: write
concurrency:
  group: auto-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bağımlılıklar (penaltyblog, MIT lisans)
        run: |
          pip install numpy==2.1.3 tqdm pandas scipy orjson tabulate networkx pulp requests beautifulsoup4 lxml fsspec plotly matplotlib
          python3 lab/adim.py penaltyblog-kurulum --onem bilgi -- pip install --no-deps penaltyblog statsbombpy   # kurulamazsa yalnız kendi modellerimiz yarışır
      - name: Yarıştır
        env: { LAB_BUDGET: "3300" }
        run: python3 lab/adim.py yaristir --kritik -- python lab/auto_lab.py
      - name: 🤖 Robot arenası (5 robot + öğrenen konsey)
        env: { ARENA_BUDGET: "1500" }
        run: python3 lab/adim.py arena --onem bilgi -- python lab/arena.py
      - name: 📈 Gelişim günlüğü
        run: python3 lab/adim.py koruyucu -- python lab/guardian.py
      - name: Sonucu kaydet
        run: |
          python3 lab/gonder.py -m "Otomatik laboratuvar sonucu $(date -u +%F) [guncelle]" \
            data/auto_lab.json data/arena.json data/gelisim.json data/changes.json data/rollback.json data/saglik
