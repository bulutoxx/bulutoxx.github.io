name: OXXai hava laboratuvari (YH-32)
# Yalnız ölçüm: Wikidata (CC0) stat koordinatı + Open-Meteo (CC BY 4.0) geçmiş hava → 2,5 A/Ü piyasa olasılığına eğim,
# zaman sıralı kapı (lab/hava_lab.py). Ham hava değerleri yalnız actions/cache'te (.hava_onbellek/); depoya yalnız türetilmiş
# data/stadyum_koord.json ve toplu metrik data/hava_lab.json girer. Üretimi değiştirmez. Open-Meteo saatlik kotası nedeniyle
# veri birkaç gecede tamamlanır (önbellek doluyken çalışma birkaç dakika). Issue/mail/bildirim yok.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hava-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3
      - name: 🗃️ Hava önbelleği (ham değerler yalnız burada)
        uses: actions/cache/restore@v4
        with:
          path: .hava_onbellek
          key: hava-onbellek-${{ github.run_id }}
          restore-keys: hava-onbellek-
      - name: Hava deneyi
        env: { HAVA_BUDGET: "2700", HAVA_MAKS_CAGRI: "3200" }
        run: python3 lab/adim.py hava-lab --onem bilgi -- timeout 3000 python lab/hava_lab.py
      - name: 🗃️ Önbelleği sakla
        if: always() && hashFiles('.hava_onbellek/hava.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .hava_onbellek
          key: hava-onbellek-${{ github.run_id }}
      - name: Sonuç (günlük)
        run: cat data/hava_lab.json || true
      - name: Yalnız türetilmiş çıktıyı kaydet (yalnız main)
        if: github.ref == 'refs/heads/main'
        run: python3 lab/gonder.py -m "Hava laboratuvarı $(date -u +%F) [skip ci]" data/hava_lab.json data/stadyum_koord.json data/fb_guc.json data/saglik
