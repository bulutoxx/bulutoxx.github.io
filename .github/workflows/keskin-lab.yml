name: OXXai keskin piyasa laboratuvari (YH-02)
# Yalnız ölçüm: football-data.co.uk (motorun zaten kullandığı ücretsiz kaynak) eski sezonlarında Avg / Pinnacle / uzlaşı
# kalibrasyonunu yürüyen pencereyle sınar (lab/keskin_piyasa.py). Yalnız data/keskin_piyasa.json (toplu metrik) yazar.
# YH-23: lab/marj_lab.py marj ayırma yöntemlerini aynı arşivde karşılaştırır (data/marj_lab.json).
# YH-20: lab/milli_elo_lab.py milli takım Elo'sunu zaman sıralı sınar (data/milli_elo_lab.json; CC0 ham dosya yalnız çalışma alanında).
# Haftalık izleme (pazar); üretimi değiştirmez. Issue/mail/bildirim yok.
on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keskin-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3 scipy
      - name: Keskin piyasa deneyi
        run: python3 lab/adim.py keskin-lab --onem bilgi -- timeout 1500 python lab/keskin_piyasa.py
      - name: Marj ayırma gölge ölçümü (YH-23; power / Shin / odds-ratio / oransal / toplamsal)
        run: python3 lab/adim.py marj-lab --onem bilgi -- timeout 900 python lab/marj_lab.py
      - name: Milli takım Elo sınaması (YH-20; taban = geçmiş 1X2 sıklığı, sızıntısız yıllık ileri yürüyüş)
        run: python3 lab/adim.py milli-elo-lab --onem bilgi -- timeout 600 python lab/milli_elo_lab.py
      - name: Sonuç (günlük)
        run: cat data/keskin_piyasa.json data/marj_lab.json data/milli_elo_lab.json || true
      - name: Yalnız türetilmiş çıktıyı kaydet (yalnız main)
        if: github.ref == 'refs/heads/main'
        run: python3 lab/gonder.py -m "Keskin piyasa laboratuvarı $(date -u +%F) [skip ci]" data/keskin_piyasa.json data/marj_lab.json data/milli_elo_lab.json data/milli_elo.json data/fb_guc.json data/saglik
