name: OXXai keskin piyasa laboratuvari (YH-02)
# Yalnız ölçüm: football-data.co.uk (motorun zaten kullandığı ücretsiz kaynak) eski sezonlarında Avg / Pinnacle / uzlaşı
# kalibrasyonunu yürüyen pencereyle sınar (lab/keskin_piyasa.py). Yalnız data/keskin_piyasa.json (toplu metrik) yazar.
on:
  push:
    branches: ["yh02-keskin"]
    paths: ["lab/keskin_piyasa.py", ".github/workflows/keskin-lab.yml"]
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keskin-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3
      - name: Keskin piyasa deneyi
        run: python3 lab/adim.py keskin-lab --onem bilgi -- timeout 1500 python lab/keskin_piyasa.py
      - name: Sonuç (günlük)
        run: cat data/keskin_piyasa.json || true
      - name: Yalnız türetilmiş çıktıyı kaydet (yalnız main)
        if: github.ref == 'refs/heads/main'
        run: python3 lab/gonder.py -m "Keskin piyasa laboratuvarı $(date -u +%F) [skip ci]" data/keskin_piyasa.json data/saglik
