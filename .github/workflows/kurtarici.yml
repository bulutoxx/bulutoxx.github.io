name: OXXai kurtarıcı bekçi
# 20 dakikada bir: yarım kalan, hata veren ya da hiç çalışmayan otomatik işleri fark eder ve devam ettirir (lab/kurtarici.py).
# Issue, mail, bildirim açmaz. Ücretsiz: yalnız GitHub'ın kendi gh aracı.
on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kurtarici
  cancel-in-progress: false
jobs:
  bekci:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: 🛟 Kurtarıcı
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 lab/kurtarici.py || true
      - run: |
          git config user.name "bulutoxx-bot"; git config user.email "bulutoxx-bot@users.noreply.github.com"
          git add data/bekci.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Kurtarıcı bekçi kaydı $(date -u +%FT%H:%M) [skip ci]"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 8; done
