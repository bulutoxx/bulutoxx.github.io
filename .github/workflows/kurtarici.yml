name: OXXai kurtarıcı bekçi
# 20 dakikada bir: yarım kalan, hata veren ya da hiç çalışmayan otomatik işleri fark eder ve devam ettirir (lab/kurtarici.py).
# Ayrıca data/saglik/*.json (adım çıkış kodları), ana dosyaların tazeliği ve kalite alarmlarını okur; özet data/saglik.json.
# Issue, mail, bildirim açmaz. Ücretsiz: yalnız GitHub'ın kendi gh aracı.
on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kurtarici
  cancel-in-progress: false
jobs:
  bekci:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: 🛟 Kurtarıcı
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 lab/adim.py kurtarici -- python3 lab/kurtarici.py
      - name: Kaydet (yalnız durum değiştiyse)
        run: python3 lab/gonder.py -m "Kurtarıcı bekçi kaydı $(date -u +%FT%H:%M) [skip ci]" data/bekci.json data/saglik.json data/saglik
