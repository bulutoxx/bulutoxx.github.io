name: OXXai canlı kayıt
# Canlı maçlardaki en yüksek olasılıklı seçimi kilitleyip kaydeder (Power Now kendi isabetinden öğrenir).
# Tek iş içinde döngü: ~25 dakika boyunca 5 dakikada bir kayıt. GitHub zamanlayıcısı kısa aralıklı işleri gecikmeyle başlattığı
# için (15 dk hedef → gerçekte ~32 dk) zamanlayıcı yalnız işi tazeler: 20 dakikada bir tetikler, concurrency kuyruğu işlerin üst
# üste binmesini önler (en çok bir iş bekler), böylece kayıt pratikte kesintisiz 5 dk aralıkla sürer.
# Tüm turlar TEK commit'te birleşir (lab/gonder.py: aynı dosyaya yazan diğer işlerle anahtar düzeyinde, veri kaybetmeden birleştirir).
# Her adımın çıkış kodu ve süresi data/saglik/live-log.json'a yazılır (lab/adim.py); kurtarıcı bunu okur.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-log
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TUR: "6"          # 6 tur × 5 dk ≈ 25 dk
      ARALIK_SN: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3
      - name: 🏀 Basket canlı anlık görüntü (arka planda, 5 dk arayla; YH-05 → data/archive/bk_live/)
        run: |
          nohup timeout 1800 python3 scripts/bk_canli.py dongu "$TUR" "$ARALIK_SN" > "$RUNNER_TEMP/bk_canli.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bk_canli.pid"
      - name: ⏱️ Canlı kayıt döngüsü (5 dk arayla) + 🛡️ bekçi
        run: |
          for i in $(seq 1 "$TUR"); do
            t0=$(date +%s)
            if [ "$i" -gt 1 ]; then
              # girdileri (maç öncesi gol beklentisi, model, günün kilitli önerileri) uzak daldan tazele; bunlar bu işte commit edilmez
              BUGUN=$(TZ=Europe/Istanbul date +%F); DUN=$(TZ=Europe/Istanbul date -d yesterday +%F)
              python3 lab/gonder.py --tazele data/iddaa.json data/model.json data/daily.json "data/archive/$BUGUN.json" "data/archive/$DUN.json"
            fi
            python3 lab/adim.py canli-kayit -- timeout 240 python scripts/collector.py live
            python3 lab/adim.py bekci --onem bilgi -- timeout 60 python lab/watchdog.py
            if [ "$i" -lt "$TUR" ]; then
              s=$(( t0 + ARALIK_SN - $(date +%s) ))
              if [ "$s" -gt 0 ]; then sleep "$s"; fi
            fi
          done
      - name: 🏀 Basket canlı kaydının bitmesini bekle (Kaydet'ten önce; dosyalar yazılırken git işlemi olmasın)
        if: always()
        run: |
          P=$(cat "$RUNNER_TEMP/bk_canli.pid" 2>/dev/null || true)
          if [ -n "$P" ]; then for i in $(seq 1 120); do kill -0 "$P" 2>/dev/null || break; sleep 5; done; fi
          tail -20 "$RUNNER_TEMP/bk_canli.log" 2>/dev/null || true
      - name: Kaydet (tüm turlar tek commit)
        run: python3 lab/gonder.py -m "Canlı seçim kaydı $(date -u +%FT%H:%M) [skip ci]" data/archive/live data/archive/live_stats data/health.json data/saglik
      - name: 🏀 Basket canlı kaydını gönder (YH-05)
        if: always()
        run: |
          if [ -d data/archive/bk_live ]; then
            python3 lab/adim.py bk-canli-gonder --onem bilgi -- python3 lab/gonder.py -m "Basket canlı anlık görüntü $(date -u +%FT%H:%M) [skip ci]" data/archive/bk_live
          fi
