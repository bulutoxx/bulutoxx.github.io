name: BULUTOXX otonom ekip
# Her gün: 🗄️ derin arşiv (bitmiş eski sezonlar, bir kez), 🔬 araştırmacı (kaynak keşfi, kütüphane takibi, marj deneyi), 📊 analist (lig güven katsayıları),
# 🎨 tasarımcı/kalite (yayındaki uygulamayı telefonda açıp her düğmeyi dener, ekran görüntüsü alır),
# 💬 sohbet koçu (Bulut'a günün verisinden yeni takım/lig adları, kalıplar, terimler öğretir; test başarısını düşürmüyorsa yayınlar).
# Doğrulanan bulgular data/*.json üzerinden motora ve uygulamaya otomatik geçer; sorun varsa GitHub'da uyarı kaydı açılır.
on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/research.py", "lab/analyst.py", "lab/qa.mjs", "lab/guardian.py", "lab/dq.py", "lab/derin.py", "scripts/arsiv.py", "lab/bot_coach.mjs", "lab/bot/**", ".github/workflows/otonom-ekip.yml"]
permissions:
  contents: write
concurrency:
  group: otonom-ekip
  cancel-in-progress: false
jobs:
  ekip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install numpy==2.1.3
      - name: 🗄️ Derin arşiv (football-data bitmiş sezonlar; bir kez indirilir, sonra yalnız eksik sezon)
        env: { DERIN_SEZON: "5", DERIN_BUDGET: "600" }
        run: python lab/derin.py || echo "derin arşiv atlandı"
      - name: 🔬 Araştırmacı
        run: python lab/research.py || echo "araştırmacı atlandı"
      - name: 📊 Analist
        run: python lab/analyst.py || echo "analist atlandı"
      - name: 🛡️ Koruyucu (değişiklik izleme, gerekirse geri alma)
        run: python lab/guardian.py || echo "koruyucu atlandı"
      - name: 🧹 Veri ve güvenlik denetçisi
        run: python lab/dq.py || echo "denetçi atlandı"
      - name: 🎨 Tasarımcı / kalite
        run: |
          cd lab && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd .. && node lab/qa.mjs || echo "kalite botu atlandı"
      - name: 💬 Sohbet koçu (Bulut'a yeni bilgi + test kapısı)
        run: timeout 900 node lab/bot_coach.mjs || echo "sohbet koçu atlandı"
      - name: Kaydet
        run: |
          git config user.name "bulutoxx-bot"; git config user.email "bulutoxx-bot@users.noreply.github.com"
          git add data/derin data/research.json data/analyst.json data/qa.json data/qa data/changes.json data/rollback.json data/dq.json data/gelisim.json data/bot_kb.json data/bot_coach.json data/bot_tests.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Otonom ekip raporu $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 8; done
