name: OXXai sut guc laboratuvari (YH-03)
# Yalnız ölçüm: football-data.co.uk (motorun zaten kullandığı ücretsiz kaynak) ana lig isabetli şutlarıyla GAP güç robotunu
# zaman sıralı sınar (lab/sut_guc_lab.py). Yalnız data/sut_guc_lab.json (toplu metrik) yazar; üretimi değiştirmez. Issue/mail/bildirim yok.
on:
  push:
    branches: [yh03-sut-guc]
    paths: [lab/sut_guc_lab.py, .github/workflows/sut-guc-lab.yml]
  schedule:
    - cron: "41 4 * * 6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sut-guc-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3
      - name: Şut güç robotu deneyi
        run: python3 lab/adim.py sut-guc-lab --onem bilgi -- timeout 3000 python lab/sut_guc_lab.py
      - name: Sonuç (günlük)
        run: cat data/sut_guc_lab.json || true
      - name: Yalnız türetilmiş çıktıyı kaydet (yalnız main)
        if: github.ref == 'refs/heads/main'
        run: python3 lab/gonder.py -m "Şut güç laboratuvarı $(date -u +%F) [skip ci]" data/sut_guc_lab.json data/saglik
