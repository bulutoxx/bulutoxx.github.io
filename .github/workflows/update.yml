name: BULUTOXX güncelle ve yayınla

on:
  schedule:
    - cron: "17 * * * *"    # her saat başı +17 dk: akıllı nöbet. Yeni sonuç varsa tam öğrenme, yoksa yalnızca oran/fikstür tazeleme
  workflow_dispatch: {}     # Actions sekmesinden "Run workflow" ile elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bulutoxx
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[guncelle]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: Verileri indir ve modeli eğit
        run: python scripts/update.py || echo "::warning::Futbol motoru hata verdi (data/engine_error.txt)"
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}   # API-Football / API-Basketball (ücretsiz üyelik, günde 100 istek)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}     # The Odds API (ücretsiz üyelik, ayda 500 kredi)
      - name: Basketbol verilerini indir ve modeli eğit
        run: python scripts/basket.py || echo "Basketbol güncellemesi bu sefer atlandı"
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "bulutoxx-bot"
          git config user.email "bulutoxx-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Veri ve model güncellemesi $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push || (git pull --rebase -X theirs origin main && git push)

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
