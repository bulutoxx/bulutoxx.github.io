name: OXXai güncelle ve yayınla
# Her adımın çıkış kodu ve süresi data/saglik/update.json'a yazılır (lab/adim.py; hata iş akışını durdurmaz ama kaydedilir,
# kurtarıcı görür). Kaydetme lab/gonder.py: aynı dosyalara yazan diğer işlerle anahtar düzeyinde, veri kaybetmeden birleştirir.

on:
  schedule:
    - cron: "17 * * * *"    # her saat başı +17 dk: akıllı nöbet. Yeni sonuç varsa tam öğrenme, yoksa yalnızca oran/fikstür tazeleme
  workflow_dispatch: {}     # Actions sekmesinden "Run workflow" ile elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bulutoxx
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[guncelle]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: 🗃️ Önbellekleri arşivden al (release "veri-arsiv"; olmazsa git yedeği, o da olmazsa basket.py yeniden indirir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-indir --onem bilgi -- python3 lab/arsiv.py indir data/bk_games.json data/at/replay_kosular.json
      - name: Verileri indir ve modeli eğit
        run: python3 lab/adim.py motor -- python scripts/update.py   # hata → data/engine_error.txt ve sağlık kaydı
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}   # API-Football / API-Basketball (ücretsiz üyelik, günde 100 istek)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}     # The Odds API (ücretsiz üyelik, ayda 500 kredi)
      - name: Açık veri (Club Elo → kupa güçleri; bayrak data/acik/elo_kupa.json, geri alınabilir)
        run: python3 lab/adim.py acik-veri --onem bilgi -- timeout 120 python scripts/acik_veri.py
      - name: Veri toplayıcı (öneri arşivi, sonuç puanlama, günlük özet)
        run: python3 lab/adim.py toplayici -- python scripts/collector.py
      - name: Basketbol verilerini indir ve modeli eğit
        run: python3 lab/adim.py basket -- python scripts/basket.py
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: 🎟️ OXXai kupon robotu (maçtan önce kilit, sonuç puanı, karne)
        run: python3 lab/adim.py oxx-kupon -- timeout 300 python scripts/oxx_kupon.py
      - name: 🗃️ Basket önbelleğini arşive yükle (yalnız değiştiyse, en çok 6 saatte bir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-yukle -- python3 lab/arsiv.py yukle --en-az-saat 6 data/bk_games.json
      - name: Değişiklikleri kaydet
        run: python3 lab/gonder.py -m "Veri ve model güncellemesi $(date -u +%F)" data

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
