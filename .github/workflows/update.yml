name: OXXai güncelle ve yayınla
# Her adımın çıkış kodu ve süresi data/saglik/update.json'a yazılır (lab/adim.py; hata iş akışını durdurmaz ama kaydedilir,
# kurtarıcı görür). Kaydetme lab/gonder.py: aynı dosyalara yazan diğer işlerle anahtar düzeyinde, veri kaybetmeden birleştirir.

on:
  schedule:
    - cron: "17 * * * *"    # her saat başı +17 dk: akıllı nöbet. Yeni sonuç varsa tam öğrenme, yoksa yalnızca oran/fikstür tazeleme
  workflow_dispatch: {}     # Actions sekmesinden "Run workflow" ile elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bulutoxx
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[guncelle]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: 🗃️ Önbellekleri arşivden al (release "veri-arsiv"; olmazsa git yedeği, o da olmazsa basket.py yeniden indirir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-indir --onem bilgi -- python3 lab/arsiv.py indir data/bk_games.json data/at/replay_kosular.json
      - name: Verileri indir ve modeli eğit
        run: python3 lab/adim.py motor -- python scripts/update.py   # hata → data/engine_error.txt ve sağlık kaydı
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}   # API-Football / API-Basketball (ücretsiz üyelik, günde 100 istek)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}     # The Odds API (ücretsiz üyelik, ayda 500 kredi)
      - name: Açık veri (Club Elo → kupa güçleri; bayrak data/acik/elo_kupa.json, geri alınabilir)
        run: python3 lab/adim.py acik-veri --onem bilgi -- timeout 120 python scripts/acik_veri.py
      - name: Veri toplayıcı (öneri arşivi, sonuç puanlama, günlük özet)
        run: python3 lab/adim.py toplayici -- python scripts/collector.py
      - name: Basketbol verilerini indir ve modeli eğit
        run: python3 lab/adim.py basket -- python scripts/basket.py
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: 🎟️ OXXai kupon robotu (maçtan önce kilit, sonuç puanı, karne)
        run: python3 lab/adim.py oxx-kupon -- timeout 300 python scripts/oxx_kupon.py
      - name: 🗃️ Basket önbelleğini arşive yükle (yalnız değiştiyse, en çok 6 saatte bir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/adim.py arsiv-yukle -- python3 lab/arsiv.py yukle --en-az-saat 6 data/bk_games.json
      - name: Sürüm dosyası (data/version.json ← index.html APP_V; uygulama sürüm kontrolünde bunu okur)
        run: |
          V=$(sed -nE 's/^const APP_V="([^"]+)";.*/\1/p' index.html | head -1)
          if [ -n "$V" ]; then printf '{"v":"%s"}\n' "$V" > data/version.json; cat data/version.json; else echo "::warning::APP_V bulunamadı, version.json değişmedi"; fi
      - name: Değişiklikleri kaydet
        run: python3 lab/gonder.py -m "Veri ve model güncellemesi $(date -u +%F)" data

  deploy:
    # 🚦 Yayın kapısı: Pages "GitHub Actions" kaynağından artifact ile yayınlanır. Uygulama dosyaları (index.html, sw.js,
    # manifest.webmanifest, brain-worker.js, icons/) yayındakinden farklıysa yayından ÖNCE duman testi (lab/qa.mjs hızlı modu)
    # koşar. Geçmezse yeni uygulama yayınlanmaz: uygulama dosyaları son iyi sürüme döner, veri (data/*) yine yeni haliyle çıkar.
    # Yalnız veri değiştiyse test atlanır (yayın eskisi kadar hızlı). Yeni uygulama yayınlandıysa yayından sonra canlı adreste
    # aynı test koşar; o da geçmezse son iyi sürüm otomatik geri yayınlanır. Sonuçlar data/saglik/update-yayin.json (lab/adim.py),
    # data/qa_kapi.json ve data/qa_yayin.json'a yazılır; kurtarıcı görür. Issue/mail/bildirim açılmaz.
    # 📦 Pages'e tüm depo DEĞİL, yalnız uygulamanın istediği dosyalar çıkar (lab/yayin_listesi.py → $RUNNER_TEMP/_site):
    # index.html/sw.js/manifest'te geçen yollar + bilinen dinamik yollar (data/at/canli/<gün>.json, tahmin, oran_izi, version.json …).
    # lab/, scripts/, data/derin/ gibi robot iç verisi yayınlanmaz. Duman testi bu daraltılmış klasörü sınar; 404 alan istek = red.
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ADIM_ALT: yayin            # sağlık kaydı: data/saglik/update-yayin.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: pages
        uses: actions/configure-pages@v5
      - name: 🚦 Kapı kararı (uygulama yayındakiyle aynı mı?)
        id: karar
        run: |
          echo "basla=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 lab/yayin_kapisi.py karar --canli "${{ steps.pages.outputs.base_url }}"
      - uses: actions/setup-node@v4
        if: steps.karar.outputs.karar == 'test'
        with: { node-version: "20" }
      - uses: actions/cache@v4
        if: steps.karar.outputs.karar == 'test'
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.48.2-${{ runner.os }}
      - name: 💨 Yayın öncesi duman testi (yerel kopya, hızlı mod)
        id: kapi
        if: steps.karar.outputs.karar == 'test'
        continue-on-error: true
        run: |
          python3 lab/adim.py duman-kurulum --onem bilgi -- bash lab/duman.sh kur
          python3 lab/yayin_listesi.py kur "$RUNNER_TEMP/site_kapi"
          python3 lab/adim.py yayin-kapisi --onem bilgi --kritik -- bash lab/duman.sh "$RUNNER_TEMP/site_kapi" "$RUNNER_TEMP/qa_kapi.json"
      - name: ↩️ Test geçmedi → uygulama son iyi sürümde kalır (veri yine güncellenir)
        id: geri
        if: steps.karar.outputs.karar == 'red' || (steps.karar.outputs.karar == 'test' && steps.kapi.outcome != 'success')
        run: |
          python3 lab/adim.py yayin-geri-al --onem bilgi --kritik -- python3 lab/yayin_kapisi.py geri --commit "${{ steps.karar.outputs.canli_commit }}" --canli "${{ steps.pages.outputs.base_url }}"
          echo "::warning title=Yayın kapısı::Yeni uygulama sürümü yayınlanmadı (${{ steps.karar.outputs.karar }}); son iyi sürüm yayında kalıyor, veri güncellendi."
      - name: Sürüm dosyası (data/version.json ← yayınlanacak index.html APP_V) ve yayin.json
        run: |
          V=$(sed -nE 's/^const APP_V="([^"]+)";.*/\1/p' index.html | head -1)
          if [ -n "$V" ]; then printf '{"v":"%s"}\n' "$V" > data/version.json; cat data/version.json; else echo "::warning::APP_V bulunamadı, version.json değişmedi"; fi
          if [ "${{ steps.karar.outputs.karar }}" = "test" ] && [ "${{ steps.kapi.outcome }}" != "success" ]; then
            python3 lab/yayin_kapisi.py yaz --commit "${{ steps.karar.outputs.canli_commit }}" \
              --red-ozet "${{ steps.karar.outputs.ozet }}" --red-commit "${{ steps.karar.outputs.basla }}" --red-neden-qa "$RUNNER_TEMP/qa_kapi.json"
          elif [ "${{ steps.karar.outputs.karar }}" = "red" ]; then
            python3 lab/yayin_kapisi.py yaz --commit "${{ steps.karar.outputs.canli_commit }}" --canli "${{ steps.pages.outputs.base_url }}" --onceki-red-koru
          elif [ "${{ steps.karar.outputs.karar }}" = "atla" ]; then
            python3 lab/yayin_kapisi.py yaz --commit "${{ steps.karar.outputs.basla }}" --canli "${{ steps.pages.outputs.base_url }}" --onceki-red-koru
          else
            python3 lab/yayin_kapisi.py yaz --commit "${{ steps.karar.outputs.basla }}"
          fi
      - name: 📦 Yayın klasörü (yalnız uygulamanın istediği dosyalar)
        run: python3 lab/yayin_listesi.py kur "$RUNNER_TEMP/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/_site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 🔎 Yayın sonrası duman testi (canlı adres; yalnız yeni uygulama yayınlandıysa)
        id: canli
        if: steps.karar.outputs.karar == 'test' && steps.kapi.outcome == 'success'
        continue-on-error: true
        run: |
          python3 lab/yayin_kapisi.py bekle --canli "${{ steps.pages.outputs.base_url }}" --ozet "${{ steps.karar.outputs.ozet }}" --sn 300 || true
          ok=1
          for d in 1 2; do   # canlı ortamda ağ dalgalanmasına karşı bir kez daha dene
            if python3 lab/adim.py yayin-sonrasi --onem bilgi --kritik -- bash lab/duman.sh "${{ steps.pages.outputs.base_url }}/" data/qa_yayin.json; then ok=0; break; fi
            sleep 30
          done
          exit $ok
      - name: ↩️ Canlı test geçmedi → son iyi sürümü geri yayınla
        id: geri2
        if: steps.canli.outcome == 'failure' && steps.karar.outputs.canli_commit != 'yok'
        run: |
          python3 lab/adim.py yayin-geri-al-canli --onem bilgi --kritik -- python3 lab/yayin_kapisi.py geri --commit "${{ steps.karar.outputs.canli_commit }}" --canli ""
          V=$(sed -nE 's/^const APP_V="([^"]+)";.*/\1/p' index.html | head -1)
          if [ -n "$V" ]; then printf '{"v":"%s"}\n' "$V" > data/version.json; fi
          python3 lab/yayin_kapisi.py yaz --commit "${{ steps.karar.outputs.canli_commit }}" \
            --red-ozet "${{ steps.karar.outputs.ozet }}" --red-commit "${{ steps.karar.outputs.basla }}" --red-neden "canlı test:" --red-neden-qa data/qa_yayin.json
          python3 lab/yayin_listesi.py kur "$RUNNER_TEMP/_site_geri"
          echo "::warning title=Yayın geri alındı::Canlı duman testi geçmedi; son iyi uygulama sürümü yeniden yayınlandı."
      - uses: actions/upload-pages-artifact@v3
        if: steps.geri2.outcome == 'success'
        with:
          path: ${{ runner.temp }}/_site_geri
          name: github-pages-geri
      - id: deployment2
        if: steps.geri2.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-geri
      - name: Kapı kayıtlarını kaydet (sağlık + qa_kapi / qa_yayin; yalnız veri dosyaları)
        if: always()
        run: |
          git checkout -q HEAD -- index.html sw.js manifest.webmanifest brain-worker.js icons data/version.json 2>/dev/null || true
          rm -f yayin.json
          YOLLAR="data/saglik"
          if [ -s "$RUNNER_TEMP/qa_kapi.json" ]; then cp "$RUNNER_TEMP/qa_kapi.json" data/qa_kapi.json; YOLLAR="$YOLLAR data/qa_kapi.json"; fi
          if [ -s data/qa_yayin.json ]; then YOLLAR="$YOLLAR data/qa_yayin.json"; fi
          python3 lab/gonder.py -m "Yayın kapısı kaydı $(date -u +%FT%H:%M) [skip ci]" $YOLLAR || echo "::warning::kapı kaydı gönderilemedi"
