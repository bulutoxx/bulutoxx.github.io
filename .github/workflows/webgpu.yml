name: webgpu-probe
on:
  push:
    branches: [lab]
permissions:
  contents: write
jobs:
  w:
    if: contains(github.event.head_commit.message, '[webgpu]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 >/dev/null
      - run: timeout 70m node lab/webgpu_probe.mjs hafif
        continue-on-error: true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add lab/webgpu_probe_*.json || true; git commit -qm "webgpu probe [skip ci]" || true; git pull -q --rebase || true; git push || true
