<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060D">
<title>At Yarışı Prototipi</title>
<!-- BULUTOXX · At Yarışı bölümü yeniden tasarım PROTOTİPİ (lab/at/TASARIM.md).
     Tek dosya, dış kaynak yok. Veri: ../../data/at/ (tahmin, canli, altili, jokeyler, karne, kupon_karne, model).
     Uygulamaya (index.html) bağlı değildir; kupon satırları yalnız bu prototipin "bx-proto-atk" anahtarına yazılır.
     Hobi amaçlı olasılıklar; garanti değildir · 18+ -->
<style>
:root{
  --s0:#03060D;--s1:#0C1322;--s2:#121B2E;--s3:#18233A;--s4:#1F2B45;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);
  --ink:#F4F7FC;--ink2:#B6C0D3;--ink3:#8893AB;
  --blue:#2F7BFF;--cyan:#22D3FF;--ok:#3BEA7E;--no:#FF6B78;--amber:#FFB020;
  --g1:#E9C766;--g2:#D4AF37;--gi:#F3DC8A;--gink:#3B2A05;
  --gold:linear-gradient(135deg,#BF9535 0%,#C9A227 28%,#F5E08A 52%,#D4AF37 72%,#B8892B 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:10px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --hl:inset 0 1px 0 rgba(255,255,255,.045);
  --ease:cubic-bezier(.25,.8,.25,1);
  --focus:0 0 0 3px rgba(34,211,255,.55);
  --nav:64px;
}
*{box-sizing:border-box}
html{background:var(--s0);color-scheme:dark}
body{margin:0;background:var(--s0);color:var(--ink);font:15px/1.45 var(--font);letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:12px}
main:focus,main:focus-visible{box-shadow:none;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- uygulama kabuğu ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(3,6,13,.82);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding:10px 16px 0}
.tb{display:flex;align-items:center;gap:10px;min-height:44px}
.tb h1{margin:0;font:750 22px/1.1 var(--font);letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb h1 small{display:block;font:500 12px/1.3 var(--font);color:var(--ink3);letter-spacing:0;margin-top:2px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);flex:none;position:relative}
.ib svg{width:20px;height:20px}
.ib .bd{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--g1);color:var(--gink);font:800 10px/16px var(--font)}
.back{display:flex;align-items:center;gap:2px;min-height:44px;padding-right:8px;color:var(--cyan);font-weight:600;font-size:16px}
.back svg{width:22px;height:22px}
.seg{display:flex;gap:4px;padding:4px;margin:10px 0 10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a,.seg button{flex:1 1 auto;min-height:38px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:5px;
  font:650 13.5px/1 var(--font);color:var(--ink2);white-space:nowrap;transition:background .18s var(--ease),color .18s}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--s4);color:var(--ink);box-shadow:var(--hl),0 2px 8px -4px rgba(0,0,0,.6)}
.seg .n{font-size:11px;font-weight:700;color:var(--g1)}
.seg.sm{margin:0 0 12px}
.seg.sm button{min-height:34px;font-size:13px}
main{max-width:620px;margin:0 auto;padding:12px 16px calc(var(--nav) + 96px)}
.fnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--nav);background:rgba(7,12,24,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;font:600 11px/1 var(--font);color:var(--ink3)}
.fnav span{display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.75}
.fnav span i{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:block}
.fnav .on{color:var(--cyan);opacity:1}
.proto{font:600 10.5px/1 var(--font);color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}

/* ---------- ortak kart / tipografi ---------- */
.card{min-width:0;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-xl);padding:14px;box-shadow:var(--hl);margin:0 0 12px}
.card.gold{border-color:rgba(233,199,102,.35);background:linear-gradient(180deg,rgba(233,199,102,.07),rgba(233,199,102,0) 60%),var(--s1)}
.ch{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.ch h2{margin:0;font:700 17px/1.25 var(--font);letter-spacing:-.012em;flex:1;min-width:0}
.ch small,.ch a.more{font:600 12.5px/1.2 var(--font);color:var(--ink3)}
.ch a.more{color:var(--cyan);min-height:32px;display:inline-flex;align-items:center}
.sec{font:700 13px/1.2 var(--font);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}
.note{font-size:13px;line-height:1.45;color:var(--ink3);margin:6px 2px}
.muted{color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:99px;font:650 12px/1 var(--font);background:var(--s3);color:var(--ink2);white-space:nowrap}
.pill.ok{background:rgba(59,234,126,.13);color:var(--ok)}
.pill.no{background:rgba(255,107,120,.13);color:var(--no)}
.pill.or{background:rgba(34,211,255,.12);color:var(--cyan)}
.pill.g{background:var(--gold);color:var(--gink)}
.pill.w{background:rgba(255,176,32,.14);color:var(--amber)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font:650 14px/1 var(--font);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:rgba(233,199,102,.14);border-color:rgba(233,199,102,.6);color:var(--gi)}
.chip small{font-size:12px;color:var(--ink3)}
.chip.sq{min-width:44px;justify-content:center;padding:0 10px;border-radius:12px}
.chip.sq.done{color:var(--ink3)}
.btn{min-height:48px;border-radius:14px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1 var(--font);width:100%}
.btn.p{background:linear-gradient(135deg,#0A78C0 0%,#1F67E6 55%,#3D5BFF 100%);color:#fff}
.btn.g{background:rgba(233,199,102,.12);border:1px solid rgba(233,199,102,.5);color:var(--gi)}
.btn.q{background:var(--s2);border:1px solid var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpis div{background:var(--s2);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.kpis b{display:block;font:800 19px/1.1 var(--font);letter-spacing:-.02em}
.kpis small{display:block;font:500 11px/1.25 var(--font);color:var(--ink3);margin-top:3px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ---------- sıradaki koşu ---------- */
.nx{display:block;position:relative;overflow:hidden}
.nx-t{display:flex;align-items:center;gap:10px}
.nx-c{font:800 34px/1 var(--font);letter-spacing:-.03em;color:var(--gi)}
.nx-c small{font-size:14px;font-weight:650;color:var(--ink3);letter-spacing:0;margin-left:2px}
.nx-m{flex:1;min-width:0}
.nx-m b,.nx-m span{white-space:normal}
.nx-m b{display:block;font:700 16px/1.25 var(--font)}
.nx-m span{font-size:13px;color:var(--ink3)}
.mini{display:grid;gap:6px;margin-top:12px}
.mini a{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;background:var(--s2);border-radius:12px}

/* ---------- at satırı ---------- */
.hno{flex:none;width:32px;height:32px;border-radius:9px;background:var(--s3);display:grid;place-items:center;font:800 14px/1 var(--font)}
.hno.top{background:var(--gold);color:var(--gink)}
.hno.w{background:var(--ok);color:#03250F}
.hn{flex:1;min-width:0}
.hn b{display:block;font:700 15px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn small{display:block;font:500 12.5px/1.35 var(--font);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{flex:none;text-align:right;min-width:52px}
.hp b{display:block;font:800 17px/1.1 var(--font);color:var(--gi)}
.hp small{display:block;font:500 11.5px/1.3 var(--font);color:var(--ink3)}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#B8892B,#F3DC8A)}
.bar.m i{background:linear-gradient(90deg,#0A78C0,#22D3FF)}
.star{color:var(--g1)}

/* ---------- program listesi ---------- */
.rl{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.rl>*{min-width:0}
.rr{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.rr .k{flex:none;width:44px;text-align:center}
.rr .k b{display:block;font:800 18px/1 var(--font)}
.rr .k small{display:block;font:600 11px/1.2 var(--font);color:var(--ink3);margin-top:3px}
.rr .m{flex:1;min-width:0}
.rr .m b{display:block;font:650 14.5px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .m small{display:block;font:500 12.5px/1.35 var(--font);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr.done{opacity:.72}
.rr .pill,.hrow .pill{flex:none}
.chev{flex:none;color:var(--ink3);width:16px;height:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--g1);margin-right:5px;vertical-align:1px}

/* ---------- padok ---------- */
.pd p{display:flex;gap:10px;margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--ink2)}
.pd p i{flex:none;font-style:normal;width:20px;text-align:center}
.pd p b{color:var(--ink)}
.pd details summary{list-style:none;min-height:40px;display:flex;align-items:center;color:var(--cyan);font-weight:650;font-size:14px;cursor:pointer}
.pd details summary::-webkit-details-marker{display:none}
.lnk{color:var(--gi);font-weight:700;border-bottom:1px dotted rgba(243,220,138,.6)}

/* ---------- altın ---------- */
.gl{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;scroll-snap-type:x mandatory}
.gl::-webkit-scrollbar{display:none}
.gc{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:linear-gradient(160deg,rgba(233,199,102,.16),rgba(233,199,102,.03)),var(--s1);border:1px solid rgba(233,199,102,.4);border-radius:18px;padding:14px}
.gc .p{font:800 32px/1 var(--font);letter-spacing:-.03em;color:var(--gi)}
.gc b{display:block;font:750 16px/1.25 var(--font);margin-top:8px}
.gc small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}

/* ---------- koşu kartı ---------- */
.rh{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.sade .hc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--s2);margin-bottom:8px}
.sade .hc.first{background:linear-gradient(160deg,rgba(233,199,102,.14),rgba(233,199,102,.02)),var(--s2);border:1px solid rgba(233,199,102,.35)}
.sade .hc .hp b{font-size:24px}
.why{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.4}
.hrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 2px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.mk{border-top:1px solid var(--line);padding:10px 0}
.mk:first-of-type{border-top:0}
.mk-a{display:flex;align-items:center;gap:10px;min-height:44px}
.mk-b{display:flex;align-items:center;gap:8px;margin:6px 0 0 42px;flex-wrap:wrap}
.mk-c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:8px 0 0 42px}
.mk-c div{background:var(--s2);border-radius:9px;padding:6px 4px;text-align:center;min-width:0}
.mk-c b{display:block;font:750 14px/1.1 var(--font)}
.mk-c small{display:block;font:500 10.5px/1.2 var(--font);color:var(--ink3);margin-top:2px;white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--no)}
.fm{display:inline-flex;gap:3px}
.fm i{font-style:normal;width:20px;height:22px;border-radius:6px;display:grid;place-items:center;font:750 12px/1 var(--font);background:var(--s3);color:var(--ink2)}
.fm i.f1{background:var(--gold);color:var(--gink)}
.fm i.f2{background:rgba(59,234,126,.18);color:var(--ok)}
.fm i.f0{color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink3);margin:8px 2px 0}
.sortb{display:flex;align-items:center;gap:6px;margin:0 0 6px;flex-wrap:wrap}
.sortb span{font-size:12.5px;color:var(--ink3)}
.sortb button{min-height:32px;padding:0 10px;border-radius:8px;background:var(--s2);font:600 12.5px/1 var(--font);color:var(--ink2)}
.sortb button[aria-pressed="true"]{background:var(--s4);color:var(--ink)}
.res{display:grid;gap:6px}
.res div{display:flex;align-items:center;gap:10px;min-height:40px}
.res .pl{flex:none;width:26px;font:800 15px/1 var(--font);color:var(--ink3)}
.res div:first-child .pl{color:var(--gi)}
.miss{border:1px dashed var(--line2);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:10px}
.miss b{color:var(--ink2)}

/* ---------- sheet (kupon kurucu) ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s var(--ease)}
.sh{width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;background:var(--s1);border-radius:22px 22px 0 0;border:1px solid var(--line2);border-bottom:0;animation:su .28s var(--ease)}
.sh-h{padding:8px 16px 0}
.sh-h .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 8px}
.sh-b{overflow:auto;padding:0 16px 12px;flex:1}
.sh-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--s1)}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.4}}
.pick{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.cols{display:flex;gap:6px;flex:none}
.cb{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line2);display:grid;place-items:center;font:750 13px/1 var(--font);color:var(--ink3)}
.cb[aria-pressed="true"]{background:var(--gold);border-color:transparent;color:var(--gink)}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink3);margin-bottom:8px}
.sum b{color:var(--ink);font-size:15px}

/* ---------- kupon çubuğu ---------- */
.kbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 10px);z-index:40;width:calc(100% - 32px);max-width:588px;
  display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 10px 8px 12px;border-radius:18px;
  background:linear-gradient(135deg,rgba(233,199,102,.22),rgba(233,199,102,.08)),rgba(12,19,34,.94);border:1px solid rgba(233,199,102,.55);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 30px -14px rgba(0,0,0,.9);animation:su .3s var(--ease)}
.kbar .kic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--gold);display:grid;place-items:center}
.kbar .kic svg{width:22px;height:22px}
.kbar .kt{flex:1;min-width:0}
.kbar .kt b{display:block;font:750 14.5px/1.2 var(--font);color:var(--gi)}
.kbar .kt small{display:block;font:500 12px/1.3 var(--font);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar .go{flex:none;min-height:40px;padding:0 14px;border-radius:12px;background:var(--gold);color:var(--gink);font:750 14px/40px var(--font)}

/* ---------- kupon ekranı ---------- */
.kr{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.kr:first-child{border-top:0;padding-top:2px}
.kr .tt{flex:none;min-width:62px;height:26px;padding:0 8px;border-radius:8px;background:rgba(233,199,102,.14);color:var(--gi);font:750 12px/26px var(--font);text-align:center}
.kr .tx{flex:1;min-width:0}
.kr .tx b{display:block;font:650 14.5px/1.3 var(--font)}
.kr .tx small{display:block;font-size:12.5px;color:var(--ink3);line-height:1.4}
.kr .tx small b{display:inline;font-size:inherit}
.kr .x{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink3);background:var(--s2)}
.kb{display:grid;gap:8px}
.kbr{display:grid;grid-template-columns:92px 1fr 52px;align-items:center;gap:8px;font-size:12.5px}
.kbr .t{color:var(--ink2);font-weight:650}
.kbr .v{text-align:right;font-weight:750}
.kbr .tr{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.07)}
.kbr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#B8892B,#F3DC8A)}
.kbr .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--cyan);border-radius:1px}
.syn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(34,211,255,.07);border:1px solid rgba(34,211,255,.25);font-size:13px;color:var(--ink2);margin-bottom:12px}
.syn svg{flex:none;width:22px;height:22px;color:var(--cyan)}

/* ---------- 6'lı ---------- */
.al-a{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line);padding:6px 0}
.al-a .i{flex:none;width:42px;font:750 14px/1.1 var(--font)}
.al-a .i small{display:block;font:500 11px/1.2 var(--font);color:var(--ink3)}
.al-a .s{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.al-a .s span{height:28px;padding:0 9px;border-radius:8px;background:var(--s3);font:650 12.5px/28px var(--font);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.al-a .s span.w{background:rgba(59,234,126,.18);color:var(--ok)}
.al-a .p{flex:none;font:750 13px/1 var(--font);color:var(--ink2)}
.al-a.a-ok .i{color:var(--ok)}.al-a.a-no .i{color:var(--no)}

/* ---------- jokey ---------- */
.jr{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--line);padding:6px 0}
.jr:first-child{border-top:0}
.jr .rk{flex:none;width:24px;font:800 14px/1 var(--font);color:var(--ink3);text-align:center}
.jr .kk{flex:none;width:76px;text-align:right}
.jr .kk b{font:800 15px/1 var(--font)}
.jr .kk .bar{margin-top:5px}

/* ---------- durumlar ---------- */

<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="main" tabindex="-1" aria-live="polite"></main>
<div id="kbar"></div>
<nav class="fnav" aria-hidden="true"><span><i></i>Canlı</span><span class="on"><i></i>Bülten</span><span><i style="border-radius:50%"></i>Power</span><span><i></i>Sonuçlar</span><span><i></i>Menü</span></nav>
<script>
"use strict";
// =====================================================================
// Veri katmanı: yalnız depodaki türetilmiş dosyalar (../../data/at/). Dış istek yok.
// =====================================================================
const BASE=(()=>{ const q=new URLSearchParams(location.search).get("veri"); return q||"../../data/at/"; })();
const S={days:[],d:null,T:{},C:{},A:{},model:null,karne:null,jok:null,kk:null,altK:null,hip:null,loading:true,err:null,
  mode:ls("bx-proto-mod","sade"),sort:"p",bt:"altili",demo:false,base0:0,t0:Date.now()};
const FAV=JSON.parse(ls("bx-proto-fav",'{"at":[],"jokey":[],"antrenor":[]}'));
let KUP=JSON.parse(ls("bx-proto-atk","[]"));
function ls(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lss(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const saveFav=()=>lss("bx-proto-fav",JSON.stringify(FAV)), saveKup=()=>{ lss("bx-proto-atk",JSON.stringify(KUP)); paintBar(); };
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=(x,d)=>x==null||!isFinite(x)?"–":"%"+(x*100).toLocaleString("tr-TR",{maximumFractionDigits:d==null?(x<.1&&x>0?1:0):d});
const fx=(x,d=2)=>x==null?"–":(+x).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
const istDay=t=>new Date(t+3*36e5).toISOString().slice(0,10);
const tsOf=(d,s)=>Date.parse(d+"T"+(s||"23:59")+":00+03:00");
const NOW=()=>S.demo?S.base0+(Date.now()-S.t0):Date.now();
const enc=encodeURIComponent, dec=decodeURIComponent;
const j=u=>fetch(BASE+u,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);

async function load(){
  S.loading=true; S.err=null; render();
  try{
    const today=istDay(Date.now()); let cand=[-1,0,1].map(o=>istDay(Date.now()+o*864e5));
    let got=await Promise.all(cand.map(d=>j("tahmin/"+d+".json")));
    if(!got.some(Boolean)){ cand=[]; for(let o=-2;o>=-9;o--) cand.push(istDay(Date.now()+o*864e5)); cand.push("2026-10-25","2026-10-26");
      got=await Promise.all(cand.map(d=>j("tahmin/"+d+".json"))); }
    S.days=[]; cand.forEach((d,i)=>{ const x=got[i]; if(x&&x.kosular&&x.kosular.length&&!S.days.includes(x.tarih)){ S.T[x.tarih]=x; S.days.push(x.tarih); } });
    S.days.sort(); S.days=S.days.slice(-3);
    if(!S.days.length){ S.err="bos"; S.loading=false; render(); return; }
    const [m,k,jk,kk,ak]=await Promise.all(["model.json","karne.json","jokeyler.json","kupon_karne.json","altili_karne.json"].map(j));
    S.model=m; S.karne=k; S.jok=jk; S.kk=kk; S.altK=ak;
    const cs=await Promise.all(S.days.map(d=>j("canli/"+d+".json"))), as=await Promise.all(S.days.map(d=>j("altili/"+d+".json")));
    S.days.forEach((d,i)=>{ if(cs[i]) S.C[d]=cs[i]; if(as[i]) S.A[d]=as[i]; });
    S.d=S.days.includes(today)?today:S.days[S.days.length-1];
    setClock();
  }catch(e){ S.err="ag"; }
  S.loading=false; render();
}
// Gerçek gün verisi yoksa prototip, canlı dosyanın son güncelleme anını "demo saati" olarak kullanır (geri sayım gerçekçi görünsün diye).
function setClock(){ const today=istDay(Date.now()); S.demo=S.d!==today;
  if(S.demo){ const C=S.C[S.d]; const g=C&&C.guncelleme_tsi?Date.parse(C.guncelleme_tsi.replace(" ","T")+":00+03:00"):tsOf(S.d,"16:10"); S.base0=g; S.t0=Date.now(); } }

// ---------- türetilmiş görünümler ----------
const races=d=>((S.T[d]||{}).kosular||[]).slice().sort((a,b)=>(a.saat||"").localeCompare(b.saat||"")||a.hipodrom.localeCompare(b.hipodrom,"tr"));
const raceById=id=>{ const d=String(id).split("/")[0]; return ((S.T[d]||{}).kosular||[]).find(r=>r.kosu_id===id)||null; };
function cOf(r){ const C=S.C[r.kosu_id.split("/")[0]]; return C?(C.kosular||[]).find(x=>x.kosu_id===r.kosu_id)||null:null; }
function M(r){ const c=cOf(r), by={}; if(c) for(const h of c.atlar||[]) by[h.no]=h;
  const A=(r.atlar||[]).map(h=>{ const x=by[h.no]||{}; const po=x.p_oran!=null?x.p_oran:null;
    return {no:String(h.no),ad:h.ad,ps:h.p_kazanma,p2:h.p_ilk2,p3:x.p_ilk3_oran!=null?x.p_ilk3_oran:h.p_ilk3,po,pq:x.p_piyasa??null,oran:x.oran??null,
      jokey:x.jokey||h.jokey||null,antrenor:x.antrenor||null,kilo:x.kilo??h.kilo??null,yas:x.yas??h.yas??null,form:x.form??h.form??null,son3:x.son3||[],why:h.gerekce||"",
      p:po!=null?po:h.p_kazanma}; });
  // ekürisi olmayan atlar için olasılıklar 1'e normalize edilir (görsel tutarlılık)
  const s=A.reduce((a,h)=>a+(h.p||0),0)||1; A.forEach(h=>h.pn=(h.p||0)/s);
  const oranli=A.some(h=>h.po!=null), son=c&&c.sonuc||null;
  return {r,c,A:A.slice().sort((a,b)=>b.p-a.p),oranli,son}; }
function st(r){ const c=cOf(r); if(c&&c.sonuc) return "bitti"; const t=tsOf(r.kosu_id.split("/")[0],r.saat), n=NOW();
  if(isFinite(t)&&n>=t) return "kosuldu"; if(c&&c.durum==="oran_var") return "oran"; return "bekliyor"; }
const stPill=r=>{ const s=st(r), m=M(r);
  if(s==="bitti"){ const ok=m.son.tuttu; return `<span class="pill ${ok?"ok":"no"}">${ok?"✓":"✗"} Bitti</span>`; }
  if(s==="kosuldu") return `<span class="pill w">Sonuç bekleniyor</span>`;
  if(s==="oran") return `<span class="pill or">Oranla güncel</span>`; return `<span class="pill">Sabah tahmini</span>`; };
function golds(d){ const o=[]; for(const r of races(d)){ const A=(r.atlar||[]).slice().sort((a,b)=>b.p_kazanma-a.p_kazanma); if(A.length<2) continue;
  const gap=A[0].p_kazanma-A[1].p_kazanma; if(A[0].p_kazanma>=.35&&gap>=.12) o.push({r,h:A[0],s:A[0].p_kazanma+gap}); } return o.sort((a,b)=>b.s-a.s).slice(0,3); }
const hipsOf=d=>[...new Set(races(d).map(r=>r.hipodrom))];
const dLbl=d=>{ const t=istDay(S.demo?S.base0:Date.now()); const y=istDay(Date.parse(t)-864e5), tm=istDay(Date.parse(t)+864e5); return d===t?"Bugün":d===y?"Dün":d===tm?"Yarın":d.slice(8,10)+"."+d.slice(5,7); };
const hm=t=>new Date(t+3*36e5).toISOString().slice(11,16);
const isFav=(k,v)=>FAV[k].includes(v);
function togFav(k,v){ const i=FAV[k].indexOf(v); if(i>=0) FAV[k].splice(i,1); else FAV[k].push(v); saveFav(); toast(i>=0?"Takipten çıkarıldı":"⭐ Takip listende"); render(); }
const FORM=f=>f?`<span class="fm" aria-label="Son koşu dereceleri ${esc(f.split("").join(", "))}">${String(f).slice(-6).split("").map(c=>`<i class="${c==="1"?"f1":c==="2"||c==="3"?"f2":c==="0"?"f0":""}">${esc(c)}</i>`).join("")}</span>`:`<span class="muted" style="font-size:12.5px">ilk koşusu / form yok</span>`;

// ---------- Harville (indirimli) olasılıkları: kupon_karne.json → γ, δ ----------
function gd(o){ const H=(S.kk&&S.kk.harville)||{}; return o?[H.gamma_oran||H.gamma||1,H.delta_oran||H.delta||1]:[H.gamma||1,H.delta||1]; }
function ordP(ps,seq,g,d){ let pr=1; const used=new Set();
  for(let k=0;k<seq.length;k++){ const e=k===0?1:k===1?g:d; let den=0; for(const [n,p] of ps) if(!used.has(n)) den+=Math.pow(p,e);
    const pi=ps.get(seq[k]); if(pi==null||!den) return 0; pr*=Math.pow(pi,e)/den; used.add(seq[k]); } return pr; }
const TUR={ganyan:{ad:"Ganyan",k:"Koşunun birincisi",lb:["Seç"]},plase:{ad:"Plase",k:"At ilk ikiye girer",lb:["Seç"]},
  ikili:{ad:"İkili",k:"İlk iki, sırasız",lb:["Seç"]},sirali_ikili:{ad:"Sıralı İkili",k:"İlk iki, sıralı",lb:["1.","2."]},
  uclu:{ad:"Sıralı Üçlü",k:"İlk üç, sıralı",lb:["1.","2.","3."]},cifte:{ad:"Çifte",k:"Bu ve sonraki koşunun birincileri",lb:["Seç"]}};
function calc(tur,m,cols,m2,c2){ const ps=new Map(m.A.map(h=>[h.no,h.pn])), [g,d]=gd(m.oranli), nos=[...ps.keys()];
  let k=0,p=0; const S0=cols[0]||[];
  if(tur==="ganyan"){ k=S0.length; p=S0.reduce((a,n)=>a+(ps.get(n)||0),0); }
  else if(tur==="plase"){ k=S0.length; for(const a of nos) for(const b of nos) if(a!==b&&(S0.includes(a)||S0.includes(b))) p+=ordP(ps,[a,b],g,d); }
  else if(tur==="ikili"){ for(let i=0;i<S0.length;i++) for(let q=i+1;q<S0.length;q++){ k++; p+=ordP(ps,[S0[i],S0[q]],g,d)+ordP(ps,[S0[q],S0[i]],g,d); } }
  else if(tur==="sirali_ikili"){ for(const a of cols[0]||[]) for(const b of cols[1]||[]) if(a!==b){ k++; p+=ordP(ps,[a,b],g,d); } }
  else if(tur==="uclu"){ for(const a of cols[0]||[]) for(const b of cols[1]||[]) for(const c of cols[2]||[]) if(a!==b&&b!==c&&a!==c){ k++; p+=ordP(ps,[a,b,c],g,d); } }
  else if(tur==="cifte"&&m2){ const q2=new Map(m2.A.map(h=>[h.no,h.pn])); k=S0.length*(c2||[]).length; p=S0.reduce((a,n)=>a+(ps.get(n)||0),0)*(c2||[]).reduce((a,n)=>a+(q2.get(n)||0),0); }
  return {k,p:Math.min(p,1)}; }
function rowStatus(R){ if(R.tur==="altili"){ const A=S.A[R.d], X=A&&(A.altililar||[]).find(x=>x.id===R.kid); const s=X&&X.sonuc; if(!s) return "bekliyor";
    const at=(s.ayak_tuttu||{})[R.sev]||[]; if(at.some(v=>v===false)) return "tutmadi"; return s.tamam?"tuttu":"bekliyor"; }
  const r=raceById(R.kid), c=r&&cOf(r), so=c&&c.sonuc; if(!so) return "bekliyor"; const s=(so.sira||[]).map(String), C=R.cols;
  let ok=false; if(R.tur==="ganyan") ok=C[0].includes(s[0]); else if(R.tur==="plase") ok=C[0].includes(s[0])||C[0].includes(s[1]);
  else if(R.tur==="ikili") ok=C[0].includes(s[0])&&C[0].includes(s[1]); else if(R.tur==="sirali_ikili") ok=C[0].includes(s[0])&&C[1].includes(s[1]);
  else if(R.tur==="uclu") ok=C[0].includes(s[0])&&C[1].includes(s[1])&&C[2].includes(s[2]);
  else if(R.tur==="cifte"){ const r2=raceById(R.kid2), c2=r2&&cOf(r2), s2=c2&&c2.sonuc; if(!s2) return C[0].includes(s[0])?"bekliyor":"tutmadi"; ok=C[0].includes(s[0])&&R.c2.includes(String(s2.kazanan)); }
  return ok?"tuttu":"tutmadi"; }

// =====================================================================
// Yönlendirme: #/bugun #/program #/bahis #/sonuc #/kupon · #/kosu/<id> #/at/<id>/<no> #/jokey/<ad> #/antrenor/<ad> #/takip #/istatistik
// =====================================================================
const TABS=[["bugun","Bugün"],["program","Program"],["bahis","Bahis"],["sonuc","Sonuç"],["kupon","Kupon"]];
function route(){ const h=(location.hash||"#/bugun").slice(2).split("/"); return {v:h[0]||"bugun",a:h.slice(1).map(dec)}; }
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); try{ $("main").focus({preventScroll:true}); }catch(e){} });

const ICON={star:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>`,
  starF:`<svg viewBox="0 0 24 24" fill="#E9C766" stroke="#E9C766" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>`,
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  chev:`<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>`,
  stat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>`,
  tik:`<svg viewBox="0 0 24 24" fill="none" stroke="#3B2A05" stroke-width="2.2" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 5v14" stroke-dasharray="2 2.4"/></svg>`,
  sync:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>`};

function topBar(rt){ const isTab=TABS.some(t=>t[0]===rt.v), nk=KUP.length;
  const right=`<a class="ib" href="#/takip" aria-label="Takip listem">${FAV.at.length+FAV.jokey.length+FAV.antrenor.length?ICON.starF:ICON.star}</a>`;
  if(isTab){ const sub=S.d?`${esc(dLbl(S.d))} · ${hipsOf(S.d).length} hipodrom · ${races(S.d).length} koşu${S.demo?` · <span class="demo">demo saati ${hm(NOW())}</span>`:""}`:S.err?"Veri yok":"Yükleniyor";
    return `<div class="tb"><h1>At Yarışı<small>${sub}</small></h1><a class="ib" href="#/istatistik" aria-label="Jokey ve model istatistikleri">${ICON.stat}</a>${right}</div>
      <nav class="seg" aria-label="At yarışı bölümleri">${TABS.map(([k,l])=>`<a href="#/${k}"${rt.v===k?' aria-current="page"':""}>${l}${k==="kupon"&&nk?` <span class="n">${nk}</span>`:""}</a>`).join("")}</nav>`; }
  const fb={kosu:"#/program",at:"#/program",jokey:"#/istatistik",antrenor:"#/istatistik",takip:"#/bugun",istatistik:"#/bugun"}[rt.v]||"#/bugun";
  const lbl={kosu:"Program",at:"Koşu",jokey:"Geri",antrenor:"Geri",takip:"At Yarışı",istatistik:"At Yarışı"}[rt.v]||"Geri";
  return `<div class="tb"><button class="back" type="button" id="bk">${ICON.back}${lbl}</button><span style="flex:1"></span>${rt.v!=="takip"?right:""}</div>`; }

function render(){ const rt=route(); $("top").innerHTML=topBar(rt); const bk=$("bk");
  if(bk) bk.onclick=()=>{ if(history.length>1) history.back(); else location.hash="#/bugun"; };
  let h="";
  if(S.loading) h=skel(); else if(S.err) h=errState();
  else{ try{ h=({bugun:vBugun,program:vProgram,bahis:vBahis,sonuc:vSonuc,kupon:vKupon,kosu:vKosu,at:vAt,jokey:vJokey,antrenor:vAntrenor,takip:vTakip,istatistik:vIst}[rt.v]||vBugun)(rt.a); }
    catch(e){ console.error(e); h=`<div class="card empty"><div class="e">⚠️</div><b>Bu ekran açılamadı</b><p>${esc(e.message)}</p><a class="btn q" href="#/bugun">Bugün'e dön</a></div>`; } }
  $("main").innerHTML=h; bind(rt); paintBar(); }
const skel=()=>`<div class="sk" style="height:132px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:180px"></div><div class="sk" style="height:64px"></div><div class="sk" style="height:64px"></div><p class="sr">Yükleniyor</p>`;
const errState=()=>S.err==="bos"?`<div class="card empty"><div class="e">🗓️</div><b>Yakın günlerde koşu programı yok</b><p>Laboratuvar her sabah 05:23 ve öğlen 12:23'te yeni programı işler. Hipodromlar genelde pazartesi dinlenir.</p><button class="btn q" type="button" data-re>Yeniden dene</button></div>`
  :`<div class="card empty"><div class="e">📡</div><b>Veri alınamadı</b><p>Bağlantını kontrol et. Son başarılı veri cihazda saklıysa çevrimdışı da gösterilir.</p><button class="btn p" type="button" data-re>Yeniden dene</button></div>`;

// ---------- 1) BUGÜN ----------
function vBugun(){ const d=S.d, R=races(d), n=NOW(); let h=dayChips();
  // sıradaki koşu
  const nx=R.find(r=>st(r)==="bekliyor"||st(r)==="oran");
  if(nx){ const m=M(nx), t=tsOf(d,nx.saat), mn=Math.max(0,Math.round((t-n)/6e4));
    h+=`<a class="card nx" href="#/kosu/${enc(nx.kosu_id)}" aria-label="Sıradaki koşu: ${esc(nx.hipodrom)} ${nx.kosu}. koşu, ${mn} dakika sonra">
      <div class="ch"><h2>Sıradaki koşu</h2>${stPill(nx)}</div>
      <div class="nx-t"><div class="nx-c" id="cd" data-t="${t}">${mn>=60?Math.floor(mn/60)+"<small>sa</small> "+(mn%60)+"<small>dk</small>":mn+"<small>dk</small>"}</div>
        <div class="nx-m"><b>${esc(nx.hipodrom)} · ${nx.kosu}. Koşu · ${esc(nx.saat)}</b><span>${esc(nx.mesafe)} m ${esc(nx.pist)} · ${esc(nx.sinif)} · ${m.A.length} at</span></div>${ICON.chev}</div>
      <div class="mini">${m.A.slice(0,3).map((x,i)=>`<div style="display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 10px;background:var(--s2);border-radius:12px"><span class="hno${i===0?" top":""}">${esc(x.no)}</span><span class="hn"><b>${isFav("at",x.ad)?'<span class="star">★</span> ':""}${esc(x.ad)}</b></span><span class="hp"><b style="font-size:15px">${P(x.p)}</b></span></div>`).join("")}</div></a>`; }
  else h+=`<div class="card empty" style="padding:18px"><div class="e">🏁</div><b>${esc(dLbl(d))} koşular tamamlandı</b><p>Sonuçlar ve karne "Sonuç" sekmesinde.</p><a class="btn q" href="#/sonuc">Sonuçlara git</a></div>`;
  // takipteki atlar
  const FT=[]; for(const r of R) for(const x of r.atlar||[]) if(isFav("at",x.ad)) FT.push({r,x});
  for(const r of R){ const c=cOf(r); for(const x of (c&&c.atlar)||[]){ if(x.jokey&&isFav("jokey",x.jokey)) FT.push({r,x,j:x.jokey}); } }

function dayChips(){ return S.days.length>1?`<div class="chips" role="group" aria-label="Gün seç">${S.days.map(x=>`<button class="chip" type="button" data-day="${x}" aria-pressed="${x===S.d}">${esc(dLbl(x))}</button>`).join("")}</div>`:""; }
function padok(d){ const R=races(d), L=[], b=R.filter(r=>st(r)==="bitti"), ok=b.filter(r=>M(r).son.tuttu).length, kal=R.filter(r=>st(r)==="bekliyor"||st(r)==="oran");

  let best=null; for(const r of kal){ const m=M(r); for(const x of m.A){ if(x.pq==null||x.pq<.12) continue; const df=x.pq-(x.ps||0); if(!best||df>best.df) best={r,x,df}; } }
  if(best&&best.df>=.06) L.push(["💹",`Piyasanın modelden çok daha fazla inandığı at: ${ln(best.r,best.x)} (${esc(best.r.hipodrom)} ${best.r.kosu}. koşu). Model ${P(best.x.ps)}, ganyan oranına göre ${P(best.x.pq)}.`]);

function oxx(d){ const O=[], G=golds(d);

    O.push({tur:"sirali_ikili",ad:"S. İkili",kid:r.kosu_id,cols:[[ik[0]],[ik[1]]],baslik:`${r.hipodrom} ${r.kosu}. koşu`,secim:ik.join(" – "),p:r.ikili_onerisi.p,k:1}); }
  const A=S.A[d]; for(const X of (A&&A.altililar)||[]) if(!(X.sonuc&&X.sonuc.biten_ayak)){ const L=X.seviyeler.orta; O.push({tur:"altili",ad:"6'lı",kid:X.id,sev:"orta",baslik:`${X.hipodrom} ${X.no}. 6'lı · Orta`,secim:L.ayaklar.map(a=>a.secim.join(",")).join(" / "),p:L.p,k:L.kombinasyon}); }
  return O; }

const foot=()=>`<p class="foot">Prototip · veri: depodaki türetilmiş dosyalar (açık TJK sonuç arşivi aynası). Hobi amaçlı olasılıktır, garanti değildir. Para tutarı gösterilmez · 18+</p>`;

// =====================================================================
// Kupon kurucu (alt sayfa). Gerçek uygulamada atkupon-v98'in openB() kurucusu kullanılır; bu, onun sadeleştirilmiş taslağıdır.
// =====================================================================
function builder(kid,pre){ const r=raceById(kid); if(!r) return; const m=M(r), d=kid.split("/")[0], r2=races(d).find(x=>x.hipodrom===r.hipodrom&&x.kosu===r.kosu+1), m2=r2?M(r2):null;
  let tur=ls("bx-proto-tur","ganyan"); if(tur==="cifte"&&!r2) tur="ganyan"; let cols=[[],[],[]], c2=[]; if(pre) cols[0]=[String(pre)];
  const ov=document.createElement("div"); ov.className="ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Kupon kur");
  const close=()=>{ ov.remove(); document.removeEventListener("keydown",kd); }; const kd=e=>{ if(e.key==="Escape") close(); }; document.addEventListener("keydown",kd);
  function paint(){ const T=TUR[tur], nc=T.lb.length, res=calc(tur,m,cols,m2,c2);
    const need=tur==="ikili"?cols[0].length>=2:tur==="cifte"?cols[0].length&&c2.length:cols.slice(0,nc).every(c=>c.length);
    const list=(MM,get,set)=>MM.A.map(x=>`<div class="pick"><span class="hno">${esc(x.no)}</span><span class="hn"><b>${esc(x.ad)}</b><small>${P(x.p)}${x.oran?" · G "+fx(x.oran):""}</small></span><span class="cols">${(tur==="cifte"?["Seç"]:T.lb).map((l,ci)=>`<button type="button" class="cb" data-c="${set}|${ci}|${esc(x.no)}" aria-pressed="${get(ci).includes(x.no)}" aria-label="${esc(x.ad)} ${esc(l)}">${esc(l)}</button>`).join("")}</span></div>`).join("");
    ov.innerHTML=`<div class="sh"><div class="sh-h"><div class="grab"></div><div style="display:flex;align-items:center;gap:8px"><b style="font:750 18px/1.2 var(--font);flex:1">${esc(r.hipodrom)} · ${r.kosu}. koşu</b><button class="ib" type="button" data-x aria-label="Kapat">✕</button></div>
      <div class="chips" style="margin:10px -16px 6px" role="group" aria-label="Bahis türü">${Object.entries(TUR).filter(([k])=>k!=="cifte"||r2).map(([k,t])=>`<button class="chip" type="button" data-tur="${k}" aria-pressed="${k===tur}">${t.ad}</button>`).join("")}</div>
      <p class="note" style="margin:0 0 6px"><b style="color:var(--ink2)">${T.k}.</b> ${tur==="ikili"?"En az 2 at seç; her ikili ayrı kombinasyon.":nc>1?"Her sıra için at seç.":"Bir ya da birkaç at seç."}</p></div>
      <div class="sh-b">${list(m,ci=>cols[ci],"a")}${tur==="cifte"&&m2?`<div class="sec">${r2.kosu}. koşu · ${esc(r2.saat)}</div>`+list(m2,()=>c2,"b"):""}</div>
      <div class="sh-f"><div class="sum"><span>Kombinasyon <b>${res.k}</b></span><span>Tutma olasılığı <b style="color:var(--gi)">${need?P(res.p,1):"–"}</b></span></div>
        <button class="btn p" type="button" data-ok ${need?"":"disabled"}>${need?"At kuponuma ekle":"Seçim yap"}</button></div></div>`;
    ov.querySelector("[data-x]").onclick=close;
    ov.querySelectorAll("[data-tur]").forEach(b=>b.onclick=()=>{ tur=b.dataset.tur; lss("bx-proto-tur",tur); cols=[[],[],[]]; c2=[]; paint(); });
    ov.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ const [set,ci,no]=b.dataset.c.split("|"); const A=set==="b"?c2:cols[+ci];
      const i=A.indexOf(no); i>=0?A.splice(i,1):A.push(no); try{ navigator.vibrate&&navigator.vibrate(6); }catch(e){} paint(); });
    const ok=ov.querySelector("[data-ok]"); if(ok) ok.onclick=()=>{ if(ok.disabled) return; const T=TUR[tur];
      const sec=tur==="cifte"?`${r.kosu}. koşu: ${cols[0].join(",")} / ${r2.kosu}. koşu: ${c2.join(",")}`:T.lb.length>1?T.lb.map((l,i)=>`${l} ${cols[i].join(",")}`).join(" · "):cols[0].map(no=>no+" "+((m.A.find(x=>x.no===no)||{}).ad||"")).join(", ");
      KUP=KUP.filter(R=>!(R.kid===kid&&R.tur!=="altili")); KUP.push({id:Date.now().toString(36),tur,ad:T.ad,kid,kid2:r2&&r2.kosu_id,cols:cols.map(c=>c.slice()),c2:c2.slice(),baslik:`${r.hipodrom} ${r.kosu}. koşu · ${r.saat}`,secim:sec,p:res.p,k:res.k});
      saveKup(); close(); toast("🎟️ At kuponuna eklendi · KUPO'da da görünür"); render(); };
  }
  ov.onclick=e=>{ if(e.target===ov) close(); }; document.body.appendChild(ov); paint(); setTimeout(()=>{ const f=ov.querySelector("[data-tur][aria-pressed=true]"); f&&f.focus(); },50); }

function paintBar(){ const rt=route(), el=$("kbar"); if(!KUP.length||rt.v==="kupon"||S.loading||S.err){ el.innerHTML=""; return; }
  const kom=KUP.reduce((a,R)=>a*(R.k||1),1), b=KUP.filter(R=>rowStatus(R)==="bekliyor").length;
  el.innerHTML=`<a class="kbar" href="#/kupon" aria-label="At kuponum: ${KUP.length} satır"><span class="kic">${ICON.tik}</span><span class="kt"><b>At kuponum · ${KUP.length} satır</b><small>${kom.toLocaleString("tr-TR")} kombinasyon · ${b} bekliyor · KUPO ile eşli</small></span><span class="go">Aç</span></a>`; }
let tT; function toast(t){ let el=document.querySelector(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=t; clearTimeout(tT); tT=setTimeout(()=>el.remove(),2200); }

function bind(rt){ const q=s=>$("main").querySelectorAll(s);
  q("[data-re]").forEach(b=>b.onclick=load);
  q("[data-day]").forEach(b=>b.onclick=()=>{ S.d=b.dataset.day; setClock(); render(); });
  q("[data-hp]").forEach(b=>b.onclick=()=>{ S.hip=b.dataset.hp; render(); });
  q("[data-hip]").forEach(b=>b.addEventListener("click",()=>{ S.hip=b.dataset.hip; }));
  q("[data-mode]").forEach(b=>b.onclick=()=>{ S.mode=b.dataset.mode; lss("bx-proto-mod",S.mode); render(); });
  q("[data-sort]").forEach(b=>b.onclick=()=>{ S.sort=b.dataset.sort; render(); });
  q("[data-bt]").forEach(b=>b.onclick=()=>{ S.bt=b.dataset.bt; render(); });
  q("[data-sev]").forEach(b=>b.onclick=()=>{ S.sev=b.dataset.sev; render(); });
  q("[data-fav]").forEach(b=>b.onclick=()=>{ const [k,...v]=b.dataset.fav.split("|"); togFav(k,v.join("|")); });
  q("[data-kur]").forEach(b=>b.onclick=()=>builder(b.dataset.kur,b.dataset.pre));
  q("[data-share]").forEach(b=>b.onclick=async()=>{ const r=raceById(b.dataset.share), m=M(r); const t=`🐎 ${r.hipodrom} ${r.kosu}. koşu · ${r.saat}\n`+m.A.slice(0,3).map((x,i)=>`${i+1}) ${x.no} ${x.ad} ${P(x.p)}`).join("\n")+"\nHobi amaçlı olasılık · 18+";
    try{ if(navigator.share){ await navigator.share({text:t}); return; } await navigator.clipboard.writeText(t); toast("📋 Kopyalandı"); }catch(e){} });
  q("[data-alt]").forEach(b=>b.onclick=()=>{ const X=(S.A[S.d].altililar||[]).find(x=>x.id===b.dataset.alt), sv=S.sev||"orta", L=X.seviyeler[sv];
    KUP=KUP.filter(R=>!(R.tur==="altili"&&R.kid===X.id)); KUP.push({id:Date.now().toString(36),tur:"altili",ad:"6'lı",kid:X.id,d:S.d,sev:sv,baslik:`${X.hipodrom} ${X.no}. 6'lı · ${({dar:"Dar",orta:"Orta",genis:"Geniş"})[sv]}`,secim:L.ayaklar.map(a=>a.secim.join(",")).join(" / "),p:L.p,k:L.kombinasyon});
    saveKup(); toast("🎟️ 6'lı at kuponuna eklendi"); render(); });
  q("[data-oxx]").forEach(b=>b.onclick=()=>{ const o=oxx(S.d)[+b.dataset.oxx]; if(!o) return; KUP=KUP.filter(R=>!(R.kid===o.kid&&R.tur===o.tur)); KUP.push(Object.assign({id:Date.now().toString(36),d:S.d},o)); saveKup(); toast("🎟️ OXX önerisi kuponuna kopyalandı"); render(); });
  q("[data-del]").forEach(b=>b.onclick=()=>{ KUP=KUP.filter(R=>R.id!==b.dataset.del); saveKup(); render(); });
  q("[data-clear]").forEach(b=>b.onclick=()=>{ if(confirm("At kuponundaki tüm satırlar silinsin mi?")){ KUP=[]; saveKup(); render(); } });
  q("[data-kupo]").forEach(b=>b.onclick=()=>toast("Uygulamada KUPO › Kuponlarım › At Kuponu açılır"));
  const cd=$("cd"); if(cd){ clearInterval(window._cd); window._cd=setInterval(()=>{ if(!document.body.contains(cd)) return clearInterval(window._cd); const mn=Math.max(0,Math.round((+cd.dataset.t-NOW())/6e4)); cd.innerHTML=mn>=60?Math.floor(mn/60)+"<small>sa</small> "+(mn%60)+"<small>dk</small>":mn+"<small>dk</small>"; },15000); }
}
render(); load();
</script>
